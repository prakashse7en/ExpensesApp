server.port = 8081
spring.application.name=digital-onboarding-userprofile
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect




spring.datasource.url=jdbc:mysql://localhost:3306/full-stack-ecommerce?useSSL=false&useUnicode=yes&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=ecommerceapp

#added below to ignore the security auto configuration
#spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration



spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/expenses
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs

#client id kecloak
jwt.auth.converter.resource-id=expenses-clientid
jwt.auth.converter.principle-attribute=expensesuser